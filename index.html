<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Acompanhamento — Ordens de Serviço</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161D;
    --panel: #1B212B;
    --panel-2: #212836;
    --line: #2B3341;
    --text: #EDEBE4;
    --text-dim: #8F98A8;
    --amber: #E8A33D;
    --amber-dim: #6B5228;
    --teal: #3FBFA8;
    --teal-dim: #1E4A42;
    --blue: #5B8DEF;
    --blue-dim: #223056;
    --danger: #E2574C;
    --danger-dim: #4A2422;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,163,61,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(63,191,168,0.05), transparent 40%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background: var(--amber); color:#14161c;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px; border-bottom:1px solid var(--line);
    background: rgba(27,33,43,0.6); backdrop-filter: blur(6px);
    position: sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 10px var(--amber);}
  .brand-icon{height:30px; width:auto; display:block; filter:drop-shadow(0 0 6px rgba(232,163,61,0.25));}
  .brand-text{font-family:var(--font-display); font-weight:700; letter-spacing:0.02em; font-size:15px;}
  .brand-text small{display:block; font-family:var(--font-body); font-weight:400; color:var(--text-dim); font-size:11px; letter-spacing:0.03em; margin-top:2px;}
  .login-logo{display:block; height:64px; width:auto; margin:0 auto 14px auto;}
  .topbar-right{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--text-dim);}
  .btn-ghost{
    background:transparent; border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500;
    transition: border-color .15s, color .15s;
  }
  .btn-ghost:hover{border-color: var(--amber); color:var(--amber);}

  /* ---------- Login ---------- */
  .login-wrap{
    flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 20px;
  }
  .ticket{
    width: 420px; max-width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .ticket::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:6px;
    background: repeating-linear-gradient(180deg, var(--amber) 0 10px, transparent 10px 18px);
    opacity:0.7;
  }
  .ticket-head{
    padding: 30px 30px 20px 34px;
    border-bottom: 1px dashed var(--line);
  }
  .ticket-head h1{
    font-family: var(--font-display); font-size: 22px; margin:0 0 6px 0; letter-spacing:0.01em;
  }
  .ticket-head p{margin:0; color:var(--text-dim); font-size:13.5px; line-height:1.5;}
  .tabs{display:flex; padding: 18px 34px 0 34px; gap:6px;}
  .tab{
    flex:1; text-align:center; padding:10px 8px; border-radius:8px 8px 0 0;
    font-size:13px; font-weight:600; color:var(--text-dim); background:transparent; border:none;
    border-bottom: 2px solid transparent;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .ticket-body{padding: 22px 34px 30px 34px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; letter-spacing:0.02em;}
  .field input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-family:var(--font-mono); font-size:15px; letter-spacing:0.05em;
  }
  .field input:focus{outline:none; border-color: var(--amber);}
  .input-with-toggle{position:relative;}
  .input-with-toggle input{padding-right:42px;}
  .toggle-visibility{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:none; color:var(--text-dim); font-size:15px;
    padding:6px; line-height:1; opacity:0.6;
  }
  .toggle-visibility:hover{opacity:1;}
  .toggle-visibility.active{color:var(--amber); opacity:1;}
  .btn-primary{
    width:100%; background: var(--amber); color:#1a1305; border:none; font-weight:700;
    padding:12px; border-radius:8px; font-size:14px; letter-spacing:0.02em;
    transition: filter .15s;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .err{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}
  .hint{font-size:11.5px; color:var(--text-dim); margin-top:14px; line-height:1.5;}

  /* ---------- Dashboard shell ---------- */
  .content{flex:1; padding: 26px 28px 60px 28px; max-width:1100px; margin:0 auto; width:100%;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-head h2{font-family:var(--font-display); font-size:22px; margin:0 0 4px 0;}
  .page-head p{margin:0; color:var(--text-dim); font-size:13.5px;}

  /* ---------- OS cards ---------- */
  .os-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(310px,1fr)); gap:16px;}
  .os-card{
    background: var(--panel); border:1px solid var(--line); border-radius: 12px;
    padding: 18px 18px 16px 20px; position:relative; overflow:hidden;
  }
  .os-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: var(--status-color, var(--amber));
  }
  .os-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .os-id{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:0.04em;}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
    background: var(--status-bg, var(--amber-dim)); color: var(--status-color, var(--amber));
  }
  .status-pill .led{width:6px;height:6px;border-radius:50%; background:currentColor;}
  .status-pill.pulse .led{animation: pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.25;}100%{opacity:1;}}
  .os-equip{font-family:var(--font-display); font-weight:600; font-size:16.5px; margin:2px 0 3px 0;}
  .os-meta{font-size:12.5px; color:var(--text-dim); margin-bottom:12px;}
  .os-meta span{color:var(--text);}
  .os-defeito{font-size:13px; color:var(--text-dim); margin-bottom:14px; line-height:1.5;}
  .timeline{border-top:1px dashed var(--line); padding-top:12px;}
  .timeline-item{display:flex; gap:10px; font-size:12.5px; margin-bottom:9px;}
  .timeline-item:last-child{margin-bottom:0;}
  .timeline-dot{width:7px;height:7px;border-radius:50%; background:var(--text-dim); margin-top:5px; flex-shrink:0;}
  .timeline-date{font-family:var(--font-mono); color:var(--text-dim); min-width:76px; flex-shrink:0;}
  .timeline-text{color:var(--text);}
  .empty{
    text-align:center; padding: 60px 20px; color:var(--text-dim);
    border:1px dashed var(--line); border-radius:12px;
  }

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .admin-tab{
    background:transparent; border:none; color:var(--text-dim); padding:10px 16px; font-size:13.5px; font-weight:600;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .admin-tab.active{color:var(--amber); border-bottom-color:var(--amber);}

  /* ---------- Sidebar layout (oficina) ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{
    width:220px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:20px 14px; flex-shrink:0;
  }
  .side-brand{display:flex; align-items:center; gap:10px; padding:0 8px 20px 8px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .side-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber); box-shadow:0 0 10px var(--amber);}
  .side-brand-text{font-family:var(--font-display); font-weight:700; font-size:14px;}
  .side-brand-text small{display:block; font-weight:400; color:var(--text-dim); font-size:10px;}
  .side-nav{display:flex; flex-direction:column; gap:2px;}
  .side-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    color:var(--text-dim); font-size:13.5px; font-weight:500; cursor:pointer;
    background:transparent; border:none; text-align:left; font-family:var(--font-body); width:100%;
  }
  .side-item svg{width:17px; height:17px; flex-shrink:0;}
  .side-item.active{background:var(--panel-2); color:var(--amber);}
  .side-item:not(.active):hover{background:rgba(255,255,255,0.03); color:var(--text);}
  .side-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line);}
  .side-tec{color:var(--text); font-weight:600; font-size:12.5px; padding:0 4px;}
  .main-area{flex:1; min-width:0;}

  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar{
      width:100%; flex-direction:row; align-items:center; padding:10px 14px; overflow-x:auto;
      border-right:none; border-bottom:1px solid var(--line);
    }
    .side-brand{border-bottom:none; padding:0 14px 0 0; margin-bottom:0; border-right:1px solid var(--line);}
    .side-brand-text small{display:none;}
    .side-nav{flex-direction:row; padding-left:10px;}
    .side-item{white-space:nowrap;}
    .side-foot{margin-top:0; margin-left:auto; padding-top:0; border-top:none; display:flex; align-items:center; gap:10px; padding-left:10px;}
    .side-tec{display:none;}
    .side-foot .btn-ghost{width:auto !important; margin-top:0 !important;}
  }
  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px;}
  .filter-bar .btn-small-primary{margin-left:auto;}
  .stats-bar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
    cursor:pointer; min-width:110px; transition: border-color .15s;
    border-top:3px solid var(--stat-color, var(--line));
  }
  .stat-card:hover{border-color:var(--amber);}
  .stat-card.active{background:var(--panel-2); border-color:var(--amber);}
  .stat-n{font-family:var(--font-display); font-size:22px; font-weight:700; line-height:1.1;}
  .stat-label{font-size:11px; color:var(--text-dim); margin-top:3px; max-width:130px;}
  .row-btn-danger{border-color:#4A2422; color:#E2574C;}
  .row-menu{position:relative; display:inline-block;}
  .row-menu summary{
    list-style:none; cursor:pointer; width:30px; height:30px; border-radius:6px;
    border:1px solid var(--line); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700;
  }
  .row-menu summary::-webkit-details-marker{display:none;}
  .row-menu summary:hover{border-color:var(--amber); color:var(--amber);}
  .row-menu[open] summary{border-color:var(--amber); color:var(--amber);}
  .row-menu-items{
    position:absolute; right:0; top:36px; z-index:20; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; padding:6px; display:flex; flex-direction:column; gap:3px; min-width:170px;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
  }
  .row-menu-items button{
    text-align:left; background:transparent; border:none; color:var(--text); padding:8px 10px;
    border-radius:6px; font-size:13px;
  }
  .row-menu-items button:hover{background:var(--panel);}
  .row-menu-items button.danger{color:#E2574C;}
  .row-btn-danger:hover{border-color:#E2574C; color:#E2574C; background:rgba(226,87,76,0.08);}
  .btn-danger-solid{background:var(--danger); color:#fff;}
  .btn-danger-solid:hover{filter:brightness(1.08);}
  .search-input{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 12px;
    border-radius:8px; font-size:13px; min-width:220px;
  }
  .search-input:focus{outline:none; border-color:var(--amber);}
  .select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 12px;
    border-radius:8px; font-size:13px;
  }
  table{width:100%; border-collapse:collapse; background:var(--panel); border-radius:12px; overflow:hidden;}
  thead th{
    text-align:left; font-size:11px; letter-spacing:0.04em; color:var(--text-dim); font-weight:600;
    padding:12px 14px; border-bottom:1px solid var(--line); text-transform:uppercase;
  }
  .sortable-th{cursor:pointer; user-select:none; white-space:nowrap;}
  .sortable-th:hover{color:var(--amber);}
  tbody td{padding:13px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  .row-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:6px 10px;
    border-radius:6px; font-size:11.5px; margin-right:6px;
  }
  .row-btn:hover{border-color:var(--amber); color:var(--amber);}
  .pin-code{font-family:var(--font-mono); background:var(--panel-2); padding:2px 8px; border-radius:5px; letter-spacing:0.06em;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,16,0.65); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; width:460px; max-width:100%;
    max-height:88vh; overflow-y:auto; padding:26px 26px 22px 26px;
  }
  .modal h3{font-family:var(--font-display); margin:0 0 18px 0; font-size:17px;}

  /* ---------- Tabbed modal variant ---------- */
  .modal-tabbed{padding:0; width:600px;}
  .modal-head-bar{
    background:var(--panel-2); padding:18px 22px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line); border-radius:14px 14px 0 0;
  }
  .modal-icon-box{
    width:38px; height:38px; border-radius:9px; background:var(--amber-dim); color:var(--amber);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .modal-icon-box svg{width:19px; height:19px;}
  .modal-head-titles{flex:1; min-width:0;}
  .modal-head-titles h3{font-family:var(--font-display); font-size:16px; margin:0 0 2px 0;}
  .modal-head-titles p{margin:0; font-size:11.5px; color:var(--text-dim);}
  .modal-head-close{color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1; flex-shrink:0; background:none; border:none;}
  .modal-tabs{display:flex; border-bottom:1px solid var(--line); overflow-x:auto;}
  .modal-tab{
    padding:12px 16px; font-size:12.5px; font-weight:600; color:var(--text-dim); white-space:nowrap;
    border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
    font-family:var(--font-body);
  }
  .modal-tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .tab-panel{display:none; padding:20px 22px;}
  .tab-panel.active{display:block;}
  .modal-foot-bar{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--line);}

  .hist-add{display:flex; gap:10px; margin-bottom:18px;}
  .hist-add input{flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:8px; font-size:13.5px;}
  .hist-item{border-left:2px solid var(--amber); padding:2px 0 2px 14px; margin-bottom:14px;}
  .hist-item .hist-status{color:var(--amber); font-weight:600; font-size:13px;}
  .hist-item .hist-date{float:right; color:var(--text-dim); font-size:11px; font-family:var(--font-mono);}
  .hist-item p{margin:4px 0 2px 0; font-size:13px;}
  .hist-item .hist-by{font-size:11px; color:var(--text-dim);}

  .foto-drop{border:1.5px dashed var(--line); border-radius:10px; padding:28px 20px; text-align:center; color:var(--text-dim);}
  .foto-drop strong{display:block; color:var(--text); font-size:13px; margin-bottom:3px;}
  .foto-drop span{font-size:12px;}

  .checklist-box{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    display:flex; flex-direction:column; gap:7px;
  }
  .checklist-item{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;}
  .checklist-item input{width:auto;}
  .modal .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-family:var(--font-body); font-size:13.5px; resize:vertical; min-height:70px;
  }
  .modal .field select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:13.5px;
  }
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}
  .btn-secondary{
    background:transparent; border:1px solid var(--line); color:var(--text-dim); padding:10px 16px;
    border-radius:8px; font-size:13px; font-weight:500;
  }
  .btn-secondary:hover{color:var(--text);}
  .btn-small-primary{
    background:var(--amber); color:#1a1305; border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:12px 20px;
    border-radius:10px; font-size:13px; z-index:80; box-shadow:0 10px 30px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .loading{display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text-dim); font-size:13px;}

  @media (max-width:600px){
    .content{padding:20px 16px 50px 16px;}
    .topbar{padding:14px 16px;}
    table{font-size:12px;}
    thead{display:none;}
    tbody tr{display:block; margin-bottom:10px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
    tbody td{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line);}
    tbody td::before{content: attr(data-label); color:var(--text-dim); font-weight:600; font-size:11px;}

    .filter-bar{position:relative;}
    .filter-bar > *{display:none;}
    .filter-bar > .search-input{display:block; flex:1; min-width:0;}
    .filter-bar > .filter-toggle-btn{display:flex;}
    .filter-bar > .btn-small-primary{display:inline-flex;}
    .filter-bar.expanded > *{display:block;}
    .filter-bar.expanded > .filter-toggle-btn{display:flex;}
    .filter-bar.expanded{flex-direction:column; align-items:stretch;}
  }

  .filter-toggle-btn{
    display:none; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text-dim); padding:9px 12px; border-radius:8px; font-size:13px; white-space:nowrap;
  }

  @media print{
    body{background:#fff !important; color:#000 !important;}
    .topbar, .filter-bar, .admin-tabs, .row-menu, .row-btn, .btn-ghost, .stats-bar, .login-wrap{display:none !important;}
    .content{padding:0 !important;}
    table{background:#fff !important; border:1px solid #ccc !important;}
    thead th, tbody td{color:#000 !important; border-color:#ccc !important;}
    a[href]:after{content:"" !important;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Conectando ao Firestore…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
